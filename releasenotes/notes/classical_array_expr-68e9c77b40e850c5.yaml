features_c:
  - |
    Classical expression inspection now supports 1-D arrays.  ``QkExprType_Array``
    is appended to :c:enum:`QkExprType`; :c:struct:`QkExprTypeInfo` is unchanged.
    Use :c:func:`qk_var_array_type_info` and :c:func:`qk_value_array_type_info` for
    element type and length, and :c:func:`qk_value_array_len` /
    :c:func:`qk_value_array_element` to read array literals.  There are no C
    constructors for arrays.
features_circuits:
  - |
    Added 1-D classical arrays to the real-time expression system.  Declare an
    array-typed standalone variable with :class:`~.types.Array`, index it with
    :func:`~.expr.index`, and write elements or a matching whole array with
    :meth:`.QuantumCircuit.store` / :meth:`.QuantumCircuit.add_var`.  Element
    types are the existing scalars :class:`~.types.Bool`, :class:`~.types.Uint`,
    :class:`~.types.Float`, and :class:`~.types.Duration`.  Nested arrays and
    slices are not included in this release.

    Following OpenQASM 3, array sizes must be positive, and whole arrays cannot be
    compared: :func:`~.expr.equal`, :func:`~.expr.less` and the other relations
    raise :exc:`TypeError` for array operands (compare elements instead).
    :func:`~.expr.index` raises :exc:`IndexError` for a constant index outside the
    array, and the elements of an array :class:`~.expr.Value` are stored as the
    element type (``Value([1, 2], Array(Float(), 2)).value == [1.0, 2.0]``).

    QPY serializes array-typed standalone variables and array literals in the
    branch's format version :data:`~.qpy.QPY_FORK_VERSION` (200), which
    :func:`~.qpy.dump` selects automatically for such a payload.  Dumping one with
    an explicit standard version (up to 18) raises
    :exc:`~.qpy.UnsupportedFeatureForVersion`.

    The OpenQASM 3 exporter emits ``array[<type>, <n>]`` declarations, always in the
    global scope as OpenQASM 3 requires: an array local to a control-flow body is
    declared globally and initialized where it was declared.  Array literals are only
    exported as declaration initializers (whole-array stores are lowered element by
    element); an array literal used inside an expression, such as
    ``expr.index([1, 2, 3], i)``, raises :exc:`.QASM3ExporterError`.  With the
    new :attr:`.ExperimentalFeatures.PARAMETER_VECTORS_AS_ARRAYS` flag, it also
    groups an unbound :class:`.ParameterVector` into a single full-length
    ``input array[float[64], N]`` rather than one scalar input per used element.
    Without the flag, vectors export as scalar inputs, as in released Qiskit.